name: Publicar versión (Windows)

on:
  push:
    branches: [main]
    paths: ['app/package.json', '.github/workflows/release.yml']   # publicar = subir la versión en app/package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Ver si esta versión ya está publicada
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Get-Content app/package.json | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          $rels = gh api "repos/${{ github.repository }}/releases?per_page=100" | ConvertFrom-Json
          $done = $rels | Where-Object { $_.tag_name -eq "v$v" -and -not $_.draft -and ($_.assets.name -contains "latest.yml") }
          if ($done) { "skip=true" >> $env:GITHUB_OUTPUT; Write-Host "v$v ya está publicada: no se publica de nuevo" } else { "skip=false" >> $env:GITHUB_OUTPUT }
          exit 0

      - uses: actions/setup-python@v5
        if: steps.ver.outputs.skip != 'true'
        with:
          python-version: '3.12'

      - name: Empaquetar el motor (PyInstaller)
        if: steps.ver.outputs.skip != 'true'
        working-directory: engine
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --clean --onedir --console --name capcraft-engine `
            --paths . --hidden-import capcraft_subs.server `
            --collect-all faster_whisper --collect-all ctranslate2 --collect-all onnxruntime `
            --collect-all av --collect-data tokenizers run_server.py

      - name: Descargar FFmpeg (con libass)
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          $base = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest"
          Invoke-WebRequest -Uri "$base/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Invoke-WebRequest -Uri "$base/checksums.sha256" -OutFile checksums.sha256
          # verifica que el binario descargado sea exactamente el publicado (cadena de suministro)
          $line = Select-String -Path checksums.sha256 -Pattern "ffmpeg-master-latest-win64-gpl.zip" | Select-Object -First 1
          if (-not $line) { throw "No se encontró la suma de verificación de FFmpeg" }
          $expected = ($line.Line -split '\s+')[0].ToLower()
          $actual = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "Suma SHA-256 de FFmpeg no coincide: $actual vs $expected" }
          Write-Host "FFmpeg verificado: $actual"
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Get-ChildItem ffmpeg_tmp -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination ffmpeg
          Get-ChildItem ffmpeg

      - name: Probar el motor empaquetado
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: ./ci/smoke-test.ps1

      - name: Crear la etiqueta de la versión
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          $t = "v${{ steps.ver.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git ls-remote --exit-code --tags origin "refs/tags/$t" | Out-Null
          if ($LASTEXITCODE -ne 0) { git tag $t; git push origin $t }
          exit 0

      - name: Preparar la versión como borrador
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $t = "v${{ steps.ver.outputs.version }}"
          # quita borradores o versiones a medias con la misma etiqueta
          $rels = gh api "repos/${{ github.repository }}/releases?per_page=100" | ConvertFrom-Json
          foreach ($r in ($rels | Where-Object { $_.tag_name -eq $t })) { gh api -X DELETE "repos/${{ github.repository }}/releases/$($r.id)" | Out-Null }
          $msg = git log -1 --pretty=%B
          gh api -X POST "repos/${{ github.repository }}/releases" -f tag_name=$t -f name="Capcraft Editor ${{ steps.ver.outputs.version }}" -f body="$msg" -F draft=true | Out-Null

      - uses: actions/setup-node@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          node-version: '22'

      - name: Construir instalador y publicar en Releases
        if: steps.ver.outputs.skip != 'true'
        working-directory: app
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install --no-audit --no-fund
          node node_modules/electron/install.js
          npx electron-builder --win --publish always

      - name: Publicar la versión y limpiar versiones incompletas
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $t = "v${{ steps.ver.outputs.version }}"
          $rels = gh api "repos/${{ github.repository }}/releases?per_page=100" | ConvertFrom-Json
          $mine = $rels | Where-Object { $_.tag_name -eq $t } | Sort-Object { $_.assets.Count } -Descending
          $keep = $mine[0]
          if (-not ($keep.assets.name -contains "latest.yml")) { throw "Falta latest.yml en la versión $t" }
          gh api -X PATCH "repos/${{ github.repository }}/releases/$($keep.id)" -F draft=false -f make_latest=true | Out-Null
          foreach ($r in $rels) {
            if ($r.id -ne $keep.id -and -not ($r.assets.name -contains "latest.yml" -and $r.tag_name -ne $t)) {
              Write-Host "Borrando versión incompleta $($r.tag_name) ($($r.id))"
              gh api -X DELETE "repos/${{ github.repository }}/releases/$($r.id)" | Out-Null
            }
          }

      - name: Guardar el instalador como artefacto
        if: steps.ver.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: instalador
          path: app/dist/*.exe
          retention-days: 7
