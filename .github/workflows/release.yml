name: Publicar versión (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que la versión coincide con la etiqueta
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (Get-Content app/package.json | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.ref_name }}") { throw "package.json dice $v pero la etiqueta es ${{ github.ref_name }}" }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Empaquetar el motor (PyInstaller)
        working-directory: engine
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --clean --onedir --console --name capcraft-engine `
            --paths . --hidden-import capcraft_subs.server `
            --collect-all faster_whisper --collect-all ctranslate2 --collect-all onnxruntime `
            --collect-all av --collect-data tokenizers run_server.py

      - name: Descargar FFmpeg (con libass)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Get-ChildItem ffmpeg_tmp -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination ffmpeg
          Get-ChildItem ffmpeg

      - name: Probar el motor empaquetado
        shell: pwsh
        run: ./ci/smoke-test.ps1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Construir instalador y publicar en Releases
        working-directory: app
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install --no-audit --no-fund
          node node_modules/electron/install.js
          npx electron-builder --win --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}

      - name: Guardar el instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: instalador
          path: app/dist/*.exe
          retention-days: 7
